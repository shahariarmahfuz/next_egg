services:
  # ----------------------------------------------------------------------------
  # Single-Container Docker Web Service on Render
  # Runs both FastAPI (internal 127.0.0.1:8000) and Next.js (Render $PORT)
  # ----------------------------------------------------------------------------
  - type: web
    name: business-management-system
    env: docker
    region: singapore
    dockerfilePath: Dockerfile
    dockerContext: .
    envVars:
      - key: APP_NAME
        value: "Business Management System"
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: API_V1_STR
        value: "/api/v1"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SERVER_API_URL
        value: "http://127.0.0.1:8000/api/v1"
      - key: NEXT_PUBLIC_API_URL
        value: "/api/v1"
